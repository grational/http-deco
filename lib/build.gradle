// [plugins] this block must be the first
plugins {
	// support for groovy
	id 'groovy'
	// support for the api keyword in the dependencies section
	id 'java-library'
	// required by jitpack
	id 'maven-publish'
	// awesome git tag / gradle version integration
	id 'pl.allegro.tech.build.axion-release' version '1.21.1'
}

// [flavor] compatibility matrix
project.ext {
	toolchainVersion   = 25
	jvmVersion         = 8
	groovy             = [major: 3, minor: 0, patch: 25]
	groovyGroup        = groovy.major >= 4 ? 'apache' : 'codehaus'
	groovyVersion      = groovy.values().join('.')
	flavor             = "java-${jvmVersion}-groovy-${groovy.major}"
	spockVersion       = "2.4-groovy-${groovy.major}.${groovy.minor}"
	specSupportVersion = 'release-1.1.3'
}

scmVersion {
	repository {
		customUsername.set(
			providers.environmentVariable('HTTP_DECO_RELEASE_USERNAME')
				.orElse(providers.gradleProperty('release.customUsername'))
		)
		customPassword.set(
			providers.environmentVariable('HTTP_DECO_RELEASE_PASSWORD')
				.orElse(providers.gradleProperty('release.customPassword'))
		)
	}
}

project.with {
	//project.name is set in the settings.gradle with rootProject.name
	group       'it.grational'
	version     scmVersion.version // '0.5.0' (remove -SNAPSHOT for releases)
	description 'Provide all major HTTP method implementations and additional functionalities as caching and retrying.'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.toolchainVersion)
	}
	sourceCompatibility = JavaVersion.toVersion(project.jvmVersion)
	targetCompatibility = JavaVersion.toVersion(project.jvmVersion)
}

repositories {
	mavenCentral()

	maven { url "https://jitpack.io" }
}

dependencies {
	implementation (
		'redis.clients:jedis:7.0.0',
	)

	api (
		"org.${groovyGroup}.groovy:groovy:$groovyVersion",
		"org.${groovyGroup}.groovy:groovy-json:$groovyVersion"
	)

	// We use the awesome Spock testing and specification framework
	testImplementation (
		"org.spockframework:spock-core:$spockVersion",
		"com.github.grational:specification-support:$specSupportVersion",
		"org.${groovyGroup}.groovy:groovy-dateutil:$groovyVersion"
	)
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// [tasks] configuration //
tasks.withType(Test) {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(project.jvmVersion)
	}
	useJUnitPlatform()
	maxParallelForks = Runtime.runtime.availableProcessors() / 2
	if (project.jvmVersion >= 9) {
		jvmArgs('--add-opens=java.base/java.util=ALL-UNNAMED')
	}
}
jar {
	dependsOn 'check'
}

check {
	dependsOn 'clean'
}

// [tasks] definition
task uniTest(type: Test) {
	description = 'unit tests task'
	exclude '**/*ISpec*'
	exclude '**/*FSpec*'
}
task intTest(type: Test) {
	description = 'integration tests task'
	exclude '**/*USpec*'
	exclude '**/*FSpec*'
}
task funTest(type: Test) {
	description = 'functional tests task'
	exclude '**/*USpec*'
	exclude '**/*ISpec*'
}
gradle.startParameter.excludedTaskNames += "uniTest"
gradle.startParameter.excludedTaskNames += "intTest"
gradle.startParameter.excludedTaskNames += "funTest"

// required to work with jitpack.io
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'com.github.grational'
			artifactId = 'http-deco'
			version = scmVersion.version // '0.5.0' (remove -SNAPSHOT for releases)
			from components.java
		}
	}
}

